@if (!memberService.editMode()) {
  @if (photos(); as photos) {
    @if (photos.length > 0) {
      <div class="grid grid-cols-4 auto-rows-mix gap-3 p-5 h-[65vh] overflow-auto">
        @for (photo of photos; track photo.id) {
          <div class="relative">
            <img
              src="{{ photo.url }}"
              alt="photo of member"
              class="w-full rounded-lg"
              [class.opacity-30]="!photo.isApproved"
            />

            <!-- Display approval status on unapproved photos -->
            @if (!photo.isApproved) {
              <div class="absolute bottom-2 badge badge-outline badge-error">Awaiting approval</div>
            }

            @if (accountService.currentUser()?.id === memberService.member()?.id) {
              <div class="absolute top-1 right-1">
                <app-star-button
                  [disabled]="photo.url === memberService.member()?.imageUrl || !photo.isApproved"
                  (clickEvent)="setMainPhoto(photo)"
                />
              </div>
              <app-delete-button
                [disabled]="photo.url === memberService.member()?.imageUrl"
                (clickEvent)="deletePhoto(photo.id)"
                class="absolute top-1 left-1"
              />
            }
          </div>
        }
      </div>
    } @else {
      <p class="text-center text-gray-500">No photos available</p>
    }
  }
} @else {
  <app-image-upload (uploadFile)="onUploadImage($event)" [loading]="loading()" />
}
