@if (member(); as member) {
  <div routerLink="/members/{{ member.id }}" 
  class="card coursepointer transition-transform duration-300 hover:scale-105 relative">
    <img src="{{ member?.imageUrl  || '/user.png'}}"
     alt="{{ member.displayName }} image" class="rounded-lg" />

<div class="card-action bg-black z-50 
absolute bottom-0 w-full px-3 py-1 rounded-b-lg
bg-gradient-to-t from-black via-black/75
"> 
    <div class="flex flex-col text-white">
        <span class="font-semibold">{{ member.displayName }} , {{member.dateOfBirth | age}}</span>
        <span class="text-sm">{{ member.city }}</span>
    </div>
    </div>
  </div>
}
