<div class="card bg-base-100 w-1/2 mx-auto flex-col p-6 rounded-lg shadow-lg">
  <div class="card-title justify-center text-3xl text-primary">Sign up</div>
  <div class="card-body w-full">
    <ul class="steps">
      <li class="step step-primary">Credentials</li>
      <li class="step" [class.step-primary]="currnetStep() === 2">Profile</li>
    </ul>

    @if (currnetStep() === 1) {
      <form [formGroup]="credentialsForm" class="flex flex-col gap-4 w-full steps">
        <app-text-input class="mt-2" lable="Email" formControlName="email" />
        <app-text-input lable="Display name" formControlName="displayName" />
        <app-text-input lable="Password" formControlName="password" type="password" />
        <app-text-input
          lable="Confirm Password"
          formControlName="confirmPassword"
          type="password"
        />
        <div class="flex items-center justify-end gap-3">
          <button (click)="cancel()" type="button" class="btn">Cancel</button>
          <button
            [disabled]="!credentialsForm.valid"
            class="btn btn-primary"
            type="button"
            (click)="nextStep()"
          >
            Next
          </button>
        </div>
      </form>
    }

    @if (currnetStep() === 2) {
      <form [formGroup]="profilForm" class="flex flex-col w-full gap-4 steps">
      
        <div class="flex items-center gap-4">
          <div class="font-semibold">Gender: </div>
          <label class="flex  gap-3 items-center">
            <span>Male</span>
            <input type="radio" formControlName="gender" value="male"
            class="radio radio-primary">

             <span>Female</span>
            <input type="radio" formControlName="gender" value="female"
            class="radio radio-primary">
          </label>
        </div>
        

        <app-text-input [maxDate]="getMaxDate()" type="date" lable="Date of Birth" formControlName="dateOfBirth" />
        <app-text-input lable="City" formControlName="city" />
        <app-text-input lable="Country" formControlName="country" />

        <div class="flex items-center justify-end gap-3">
          <button (click)="prevStep()" type="button" class="btn">Back</button>
          <button
            [disabled]="!profilForm.valid"
            class="btn btn-primary"
            type="button"
            (click)="register()"
          >
            Register
          </button>
        </div>
      </form>
    }
  </div>

  @if(vaildationErrors().length > 0)
  {
    <div class="mt-5 flex bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
      <ul class="flex flex-col text-error space-y-1">
        @for(error of vaildationErrors(); track $index)
        {
          <li>{{error}}</li>
        }
      </ul>
    </div>
  }

</div>
